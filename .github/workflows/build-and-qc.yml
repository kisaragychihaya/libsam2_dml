name: build-and-qc

# Manual only: each matrix leg downloads ~175 MB of model weights, builds the DLL
# with MSVC, and runs the QC pass. It never runs on push/PR.
on:
  workflow_dispatch:
    inputs:
      encoder_url:
        description: URL of sam2_hiera_small.encoder.onnx
        required: false
        default: https://github.com/kisaragychihaya/libsam2_dml/releases/download/v0.1.0/sam2_hiera_small.encoder.onnx
      decoder_url:
        description: URL of sam2_hiera_small.decoder.onnx
        required: false
        default: https://github.com/kisaragychihaya/libsam2_dml/releases/download/v0.1.0/sam2_hiera_small.decoder.onnx
      runs:
        description: Timed iterations per stage (encoder/decoder/reference)
        required: false
        default: "2"
      require_dml:
        description: Fail when the directml leg reports a non-DirectML provider (WARP software adapter still counts as DirectML)
        type: boolean
        required: false
        default: true
      version:
        description: Dist zip suffix, i.e. dist-<ep>-<version>.zip (empty = git describe --tags)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-and-qc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-qc:
    name: "${{ matrix.ep }} (windows-latest)"
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Hosted runners have no GPU and no NVIDIA stack, so cuda/tensorrt legs
        # attach-fail and run the QC on the CPU fallback; they still gate the
        # build, the provider reporting, and the Go-vs-Python numerics.
        ep: [directml, cuda, tensorrt, cpu]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so git describe --tags can name the dist zip.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: example/go.mod
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch ONNX Runtime package (EP=${{ matrix.ep }})
        run: python native/third_party/fetch_ort.py ${{ matrix.ep }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure + build sam2_dml.dll (CMake + Ninja, Release x64)
        shell: pwsh
        run: |
          cmake -S native -B native/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSAM2_ORT_EP=${{ matrix.ep }}
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build native/build
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }

      - name: Build Go example (CGO_ENABLED=0)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin, models, example/out | Out-Null
          $env:CGO_ENABLED = "0"
          Push-Location example
          go build -trimpath -o ../bin/sam2qc.exe .
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { throw "go build failed" }

      - name: Stage DLLs next to the exe
        shell: pwsh
        run: |
          Copy-Item native/build/sam2_dml.dll, native/build/onnxruntime.dll bin -Force
          Get-ChildItem native/build/onnxruntime_providers_*.dll, native/build/DirectML.dll -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_ bin -Force }
          Get-ChildItem bin | Format-Table Name, Length

      - name: Download models
        shell: pwsh
        run: |
          curl.exe -L --retry 3 --fail -o models/sam2_hiera_small.encoder.onnx "${{ inputs.encoder_url }}"
          if ($LASTEXITCODE -ne 0) { throw "encoder download failed" }
          curl.exe -L --retry 3 --fail -o models/sam2_hiera_small.decoder.onnx "${{ inputs.decoder_url }}"
          if ($LASTEXITCODE -ne 0) { throw "decoder download failed" }
          Get-ChildItem models | Format-Table Name, Length

      - name: Generate deterministic synthetic test image
        shell: pwsh
        run: |
          ./bin/sam2qc.exe --gen-test-image example/out/test_image.png
          if ($LASTEXITCODE -ne 0) { throw "test image generation failed" }

      - name: Inventory display adapters
        shell: pwsh
        run: |
          Get-CimInstance Win32_VideoController |
            Select-Object Name, Status, DriverVersion, AdapterCompatibility | Format-List

      # Hosted runners have no GPU. DirectML can still run on the WARP software
      # adapter, but only if the adapter ORT enumerates at the requested
      # device_id is D3D12-capable. Probe the first four ids and export whichever
      # one reports DmlExecutionProvider for the real QC pass below. Meaningful
      # for the directml leg only; other EPs use device_id 0.
      - name: Probe DirectML adapter ids
        if: matrix.ep == 'directml'
        shell: pwsh
        env:
          SAM2_DLL: ${{ github.workspace }}\bin\sam2_dml.dll
          SAM2_ENCODER: ${{ github.workspace }}\models\sam2_hiera_small.encoder.onnx
          SAM2_DECODER: ${{ github.workspace }}\models\sam2_hiera_small.decoder.onnx
          SAM2_RUNS: "1"
        run: |
          $picked = $null
          foreach ($d in 0..3) {
            $env:SAM2_DEVICE = "$d"
            Push-Location example/out
            & "$env:GITHUB_WORKSPACE\bin\sam2qc.exe" test_image.png *> "probe_$d.log"
            $rc = $LASTEXITCODE
            Pop-Location
            $prov = (Select-String -Path "example/out/probe_$d.log" -Pattern '^encoder provider' |
                     Select-Object -First 1).Line
            $note = (Select-String -Path "example/out/probe_$d.log" -Pattern '^encoder note' |
                     Select-Object -First 1).Line
            Write-Host "SAM2_DEVICE=$d exit=$rc  $prov"
            if ($note) { Write-Host "                $note" }
            if ($prov -match 'Dml') { $picked = $d; break }
          }
          if ($null -ne $picked) {
            Write-Host "DirectML available at device_id=$picked"
            "SAM2_DEVICE=$picked" | Add-Content -Path $env:GITHUB_ENV
          } else {
            Write-Host "::warning::No DirectML device id in 0..3 initialized; the QC pass will run on the CPU provider and fail while require_dml=true."
          }
          # The probe deliberately ran binaries that exit non-zero; the GitHub
          # pwsh wrapper would otherwise fail this informational step with the
          # last native exit code.
          exit 0

      - name: Run QC (pure-Go FFI -> sam2_dml.dll)
        shell: pwsh
        env:
          SAM2_DLL: ${{ github.workspace }}\bin\sam2_dml.dll
          SAM2_ENCODER: ${{ github.workspace }}\models\sam2_hiera_small.encoder.onnx
          SAM2_DECODER: ${{ github.workspace }}\models\sam2_hiera_small.decoder.onnx
          SAM2_RUNS: ${{ inputs.runs }}
          SAM2_EXPECT: ${{ matrix.ep == 'directml' && 'Dml' || (matrix.ep == 'cuda' && 'Cuda' || (matrix.ep == 'tensorrt' && 'Tensorrt' || 'Cpu')) }}
        run: |
          $device = if ($env:SAM2_DEVICE) { $env:SAM2_DEVICE } else { "0" }
          if ("${{ matrix.ep }}" -eq "directml") {
            $requireDml = "${{ inputs.require_dml }}"
          } else {
            # No GPU/NVIDIA stack on hosted runners: the leg's EP cannot attach,
            # so the CPU fallback is the expected mode. sam2qc.exe still fails on
            # its own if the provider string does not match, a CPU fallback can
            # never pass as the expected EP, and the numerical cross-check below
            # gates the run.
            $requireDml = "false"
            $env:SAM2_ALLOW_CPU = "1"
          }
          Write-Host "SAM2_DEVICE=$device (ep=${{ matrix.ep }}, require_dml=$requireDml)"
          if ($requireDml -ne "true") {
            # Explicit, logged escape hatch: keep the numerical cross-check
            # running even when DirectML is unavailable. Never used by default.
            Write-Host "::warning::require_dml=false - setting SAM2_ALLOW_CPU=1; a CPU fallback will NOT be treated as DirectML"
            $env:SAM2_ALLOW_CPU = "1"
          }
          Push-Location example/out
          & "$env:GITHUB_WORKSPACE\bin\sam2qc.exe" test_image.png *> qc_output.log
          $rc = $LASTEXITCODE
          Pop-Location
          Get-Content example/out/qc_output.log
          # sam2qc.exe fails on its own when the provider is not DirectML, so a
          # CPU fallback can never pass as DirectML; require_dml=false only
          # downgrades that specific check to a warning.
          if ($rc -ne 0 -and $requireDml -eq "true") { throw "sam2qc.exe exited with $rc" }
          if ($rc -ne 0) {
            Write-Host "::warning::sam2qc.exe exited with $rc but require_dml=false, continuing to the numerical cross-check"
          }

      - name: Assert provider
        shell: pwsh
        run: |
          $expect = @{ directml = 'Dml'; cuda = 'Cuda'; tensorrt = 'Tensorrt'; cpu = 'Cpu' }['${{ matrix.ep }}']
          $log = Get-Content example/out/qc_output.log -Raw
          $eps = [regex]::Matches($log, '(?m)^(?<stage>encoder|decoder) provider\s*:\s*(?<p>\S+)')
          $summary = @()
          foreach ($m in $eps) {
            $line = "$($m.Groups['stage'].Value) provider = $($m.Groups['p'].Value)"
            Write-Host $line
            $summary += $line
          }
          if ($eps.Count -ne 2) { throw "expected 2 provider lines in the QC log, found $($eps.Count)" }
          $fallback = @($eps | Where-Object { $_.Groups['p'].Value -notmatch $expect })
          if ($fallback.Count -gt 0) {
            $names = $fallback | ForEach-Object { $_.Groups['p'].Value }
            if ("${{ matrix.ep }}" -eq "directml" -and "${{ inputs.require_dml }}" -eq "true") {
              throw "DirectML was required but the DLL fell back: $($names -join ', ')"
            }
            # cuda/tensorrt on GPU-less hosted runners always land here; the
            # numerical cross-check is the gate for those legs.
            Write-Host "::warning::${{ matrix.ep }} EP did not attach ($($names -join ', ')) - expected on hosted runners without a GPU/NVIDIA stack"
            $summary += "note: fell back to $($names -join ', ') - expected on hosted runners"
          }
          @("## Provider (${{ matrix.ep }})", '```', $summary, '```') | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Install Python reference deps
        run: python -m pip install --upgrade onnxruntime-directml pillow numpy

      - name: Python reference dump + compare (atol=1e-3)
        shell: pwsh
        run: |
          $runs = "${{ inputs.runs }}"
          $enc = "${{ github.workspace }}\models\sam2_hiera_small.encoder.onnx"
          $dec = "${{ github.workspace }}\models\sam2_hiera_small.decoder.onnx"
          Start-Transcript -Path example/out/compare_output.log | Out-Null
          try {
            python example/ref_dump.py --image example/out/test_image.png --resize float --runs $runs `
              --encoder $enc --decoder $dec --out example/out/ref_logits_src.bin
            if ($LASTEXITCODE -ne 0) { throw "ref_dump (image) failed" }
            python example/ref_dump.py --rgb example/out/go_rgb.bin --resize float --runs $runs `
              --encoder $enc --decoder $dec --out example/out/ref_logits_gorxgb.bin
            if ($LASTEXITCODE -ne 0) { throw "ref_dump (go_rgb.bin) failed" }

            Write-Host "`n=== GATE: same pixels the DLL saw ==="
            python example/compare.py example/out/go_logits.bin example/out/ref_logits_gorxgb.bin
            if ($LASTEXITCODE -ne 0) { throw "compare.py FAILED (go vs python, same pixels)" }

            Write-Host "`n=== GATE: same PNG decoded by both sides ==="
            python example/compare.py example/out/go_logits.bin example/out/ref_logits_src.bin
            if ($LASTEXITCODE -ne 0) { throw "compare.py FAILED (go vs python, same PNG file)" }
          } finally {
            Stop-Transcript | Out-Null
          }

      - name: Package dist zip (exe + DLLs)
        if: always()
        shell: pwsh
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          $version = "$env:VERSION_INPUT"
          if (-not $version) { $version = git describe --tags --always }
          $zip = "dist-${{ matrix.ep }}-$version.zip"
          "DIST_ZIP=$zip" | Add-Content -Path $env:GITHUB_ENV
          # Missing bin\ means an early build failure; leave the zip absent so
          # the upload step warns, same as the old per-file behavior.
          if (Test-Path bin/sam2qc.exe) {
            New-Item -ItemType Directory -Force package/bin | Out-Null
            Copy-Item bin/sam2qc.exe, bin/sam2_dml.dll, bin/onnxruntime.dll package/bin
            # Per-EP extras: onnxruntime_providers_*.dll for cuda/tensorrt,
            # DirectML.dll for directml; absent legs simply copy nothing.
            Get-ChildItem bin/onnxruntime_providers_*.dll, bin/DirectML.dll -ErrorAction SilentlyContinue |
              ForEach-Object { Copy-Item $_ package/bin -Force }
            Compress-Archive -Path package/* -DestinationPath $zip -Force
          }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sam2_dml-win-x64-${{ matrix.ep }}
          if-no-files-found: warn
          path: ${{ env.DIST_ZIP }}
