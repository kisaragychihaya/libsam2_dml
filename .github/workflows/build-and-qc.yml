name: build-and-qc

# Manual only: each backend leg downloads ~90 MB of ncnn-converted models,
# builds the DLL and runs the QC pass. It never runs on push/PR.
on:
  workflow_dispatch:
    inputs:
      encoder_param_url:
        description: URL of sam2_encoder_fixed.ncnn.param
        required: false
        default: https://github.com/kisaragychihaya/libsam2_ncnn/releases/download/v0.2.0/sam2_encoder_fixed.ncnn.param
      encoder_bin_url:
        description: URL of sam2_encoder_fixed.ncnn.bin
        required: false
        default: https://github.com/kisaragychihaya/libsam2_ncnn/releases/download/v0.2.0/sam2_encoder_fixed.ncnn.bin
      decoder_param_url:
        description: URL of sam2_decoder_fixed.ncnn.param
        required: false
        default: https://github.com/kisaragychihaya/libsam2_ncnn/releases/download/v0.2.0/sam2_decoder_fixed.ncnn.param
      decoder_bin_url:
        description: URL of sam2_decoder_fixed.ncnn.bin
        required: false
        default: https://github.com/kisaragychihaya/libsam2_ncnn/releases/download/v0.2.0/sam2_decoder_fixed.ncnn.bin
      prompt_bin_url:
        description: URL of sam2_prompt.bin
        required: false
        default: https://github.com/kisaragychihaya/libsam2_ncnn/releases/download/v0.2.0/sam2_prompt.bin
      runs:
        description: Timed iterations per stage (encoder/decoder)
        required: false
        default: "2"
      version:
        description: Dist zip suffix, i.e. dist-<version>.zip (empty = git describe --tags)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-and-qc-${{ github.ref }}
  cancel-in-progress: false

env:
  # 0a2c46bc75 = 2026-08-25 master, the era the converted models were validated
  # against. 20260526 mis-computes the deeper encoder stages; 20261020+
  # segfault on the decoder graph.
  NCNN_TAG: "0a2c46bc75987a39d3b044c77385c564e83c0a84"

jobs:
  # Build static libncnn (Vulkan enabled) once and cache it. A Vulkan-enabled
  # ncnn serves both backends: the cpu leg links the same archive and
  # delay-loads the Vulkan loader, so its DLL still has no runtime dependency.
  # ~15-25 min on a cache miss, instant on a hit; keyed by ncnn tag + runner
  # image so a bump of either rebuilds exactly once.
  libncnn:
    name: libncnn (vulkan)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: native/third_party/ncnn-install
          key: libncnn-${{ env.NCNN_TAG }}-${{ runner.os }}-amd64

      - uses: ilammy/msvc-dev-cmd@v1
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          arch: x64

      - name: Build + install static libncnn (NCNN_VULKAN=ON)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git init --quiet native/third_party/ncnn-src
          git -C native/third_party/ncnn-src remote add origin https://github.com/Tencent/ncnn
          git -C native/third_party/ncnn-src fetch --quiet --depth 1 origin $env:NCNN_TAG
          git -C native/third_party/ncnn-src checkout --quiet FETCH_HEAD
          cmake -S native/third_party/ncnn-src -B native/third_party/ncnn-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DNCNN_VULKAN=ON `
            -DNCNN_SHARED_LIB=OFF `
            -DNCNN_BUILD_TESTS=OFF -DNCNN_BUILD_TOOLS=OFF `
            -DNCNN_BUILD_EXAMPLES=OFF -DNCNN_BUILD_BENCHMARK=OFF `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/native/third_party/ncnn-install"
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build native/third_party/ncnn-build
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }
          cmake --install native/third_party/ncnn-build
          if ($LASTEXITCODE -ne 0) { throw "cmake install failed" }

      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: native/third_party/ncnn-install
          key: libncnn-${{ env.NCNN_TAG }}-${{ runner.os }}-amd64

  build-and-qc:
    name: "${{ matrix.backend }} (windows-latest)"
    runs-on: windows-latest
    timeout-minutes: 120
    needs: libncnn
    strategy:
      fail-fast: false
      matrix:
        include:
          - { backend: cpu,    vulkan: OFF, expect: Cpu,    allow_cpu: "" }
          - { backend: vulkan, vulkan: ON,  expect: Vulkan, allow_cpu: "1" }

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore libncnn (vulkan-enabled build serves both backends)
        uses: actions/cache/restore@v4
        with:
          path: native/third_party/ncnn-install
          key: libncnn-${{ env.NCNN_TAG }}-${{ runner.os }}-amd64
          fail-on-cache-miss: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Probe Vulkan (informational)
        if: matrix.vulkan == 'ON'
        shell: pwsh
        run: vulkaninfo --summary || Write-Host "::warning::vulkaninfo not available"

      - name: Configure + build sam2_ncnn.dll (CMake + Ninja, Release x64)
        shell: pwsh
        run: |
          cmake -S native -B native/build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DSAM2_VULKAN=${{ matrix.vulkan }} `
            -DNCNN_ROOT="${{ github.workspace }}/native/third_party/ncnn-install"
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build native/build
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }

      - uses: actions/setup-go@v5
        with:
          go-version-file: example/go.mod
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Go example (CGO_ENABLED=0)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin, models, example/out | Out-Null
          $env:CGO_ENABLED = "0"
          Push-Location example
          go build -trimpath -o ../bin/sam2qc.exe .
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { throw "go build failed" }

      - name: Download models
        shell: pwsh
        run: |
          curl.exe -L --retry 3 --fail -o models/sam2_encoder_fixed.ncnn.param "${{ inputs.encoder_param_url }}"
          if ($LASTEXITCODE -ne 0) { throw "encoder param download failed" }
          curl.exe -L --retry 3 --fail -o models/sam2_encoder_fixed.ncnn.bin "${{ inputs.encoder_bin_url }}"
          if ($LASTEXITCODE -ne 0) { throw "encoder bin download failed" }
          curl.exe -L --retry 3 --fail -o models/sam2_decoder_fixed.ncnn.param "${{ inputs.decoder_param_url }}"
          if ($LASTEXITCODE -ne 0) { throw "decoder param download failed" }
          curl.exe -L --retry 3 --fail -o models/sam2_decoder_fixed.ncnn.bin "${{ inputs.decoder_bin_url }}"
          if ($LASTEXITCODE -ne 0) { throw "decoder bin download failed" }
          curl.exe -L --retry 3 --fail -o models/sam2_prompt.bin "${{ inputs.prompt_bin_url }}"
          if ($LASTEXITCODE -ne 0) { throw "prompt bin download failed" }
          Get-ChildItem models | Format-Table Name, Length

      - name: Stage DLL next to the exe
        shell: pwsh
        run: |
          Copy-Item native/build/sam2_ncnn.dll bin -Force
          Get-ChildItem bin | Format-Table Name, Length

      - name: Generate deterministic synthetic test image
        shell: pwsh
        run: |
          ./bin/sam2qc.exe --gen-test-image example/out/test_image.png
          if ($LASTEXITCODE -ne 0) { throw "test image generation failed" }

      - name: Run QC (pure-Go FFI -> sam2_ncnn.dll)
        shell: pwsh
        env:
          SAM2_DLL: ${{ github.workspace }}\bin\sam2_ncnn.dll
          SAM2_ENCODER: ${{ github.workspace }}\models\sam2_encoder_fixed.ncnn.param
          SAM2_DECODER: ${{ github.workspace }}\models\sam2_decoder_fixed.ncnn.param
          SAM2_RUNS: ${{ inputs.runs }}
          SAM2_EXPECT: ${{ matrix.expect }}
          SAM2_ALLOW_CPU: ${{ matrix.allow_cpu }}
        run: |
          Write-Host "SAM2_DEVICE=0 (backend=${{ matrix.backend }}, expect=${{ matrix.expect }})"
          Push-Location example/out
          & "$env:GITHUB_WORKSPACE\bin\sam2qc.exe" test_image.png *> qc_output.log
          $rc = $LASTEXITCODE
          Pop-Location
          Get-Content example/out/qc_output.log
          if ($rc -ne 0) { throw "sam2qc.exe exited with $rc" }

      - name: Assert provider
        shell: pwsh
        run: |
          $expect = '${{ matrix.expect }}'
          $log = Get-Content example/out/qc_output.log -Raw
          $eps = [regex]::Matches($log, '(?m)^(?<stage>encoder|decoder) provider\s*:\s*(?<p>\S+)')
          $summary = @()
          foreach ($m in $eps) {
            $line = "$($m.Groups['stage'].Value) provider = $($m.Groups['p'].Value)"
            Write-Host $line
            $summary += $line
          }
          if ($eps.Count -ne 2) { throw "expected 2 provider lines in the QC log, found $($eps.Count)" }
          $fallback = @($eps | Where-Object { $_.Groups['p'].Value -notmatch $expect })
          if ($fallback.Count -gt 0) {
            $names = $fallback | ForEach-Object { $_.Groups['p'].Value }
            if ($expect -eq 'Vulkan') {
              # Hosted runners have no Vulkan-capable GPU: the DLL falls back
              # to Cpu and the numerical cross-check below is the gate.
              Write-Host "::warning::Vulkan did not attach ($($names -join ', ')) - expected on hosted runners without a GPU"
              $summary += "note: fell back to $($names -join ', ') - expected on hosted runners"
            } else {
              throw "$expect backend expected but the DLL reports: $($names -join ', ')"
            }
          }
          @("## Provider (${{ matrix.backend }})", '```', $summary, '```') | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Install Python comparison dependency
        run: python -m pip install --upgrade numpy

      - name: Compare with PyTorch single-mask reference (atol=2e-2)
        shell: pwsh
        run: |
          python example/compare.py example/out/go_logits.bin example/test_data/sam2_qc_reference.bin
          if ($LASTEXITCODE -ne 0) { throw "compare.py FAILED (Go vs PyTorch reference)" }

      - name: Package dist zip (exe + DLL)
        if: always()
        shell: pwsh
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          $version = "$env:VERSION_INPUT"
          if (-not $version) { $version = git describe --tags --always }
          $zip = "dist-$version.zip"
          "DIST_ZIP=$zip" | Add-Content -Path $env:GITHUB_ENV
          if (Test-Path bin/sam2qc.exe) {
            New-Item -ItemType Directory -Force package/bin | Out-Null
            Copy-Item bin/sam2qc.exe, bin/sam2_ncnn.dll package/bin
            Compress-Archive -Path package/* -DestinationPath $zip -Force
          }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sam2_ncnn-win-x64-${{ matrix.backend }}
          if-no-files-found: warn
          path: ${{ env.DIST_ZIP }}
